name: Build and Deploy

on:
  push:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: myapp
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-2.amazonaws.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_OIDC_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} --build-arg GIT_SHA=${{ github.sha }} app/

      - name: Tag Docker image
        run: docker tag $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push Docker images
        run: docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY

      - name: Update image in manifest
        run: |
          sed -i "s|image: \${ECR_REPO_URL}:latest|image: $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}|" app/k8s/myapp.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/k8s/myapp.yaml
          if ! git diff --staged --quiet; then
            git commit -m "ci bot - update app image to ${{ github.sha }} [skip ci]"
            git push
          fi
