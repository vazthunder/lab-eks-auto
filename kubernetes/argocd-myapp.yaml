# Make sure your SSH key is registered in GitHub first, then:
# kubectl create secret generic myapp -n argo-cd \
#   --from-literal=project=lab-argocd \
#   --from-literal=type=git \
#   --from-literal=url=git@github.com:vazthunder/lab-eks-auto.git \
#   --from-file=sshPrivateKey=<path-to-your-private-key> && \
# kubectl label secret myapp -n argo-cd argocd.argoproj.io/secret-type=repository

---

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  namespace: argo-cd
  name: myapp
spec:
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  sourceRepos:
    - '*'
  destinations:
    - namespace: myapp
      server: https://kubernetes.default.svc

---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argo-cd
  name: myapp
spec:
  project: lab-argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp
  source:
    path: app/k8s/myapp.yaml
    repoURL: git@github.com:vazthunder/lab-eks-auto.git
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
  