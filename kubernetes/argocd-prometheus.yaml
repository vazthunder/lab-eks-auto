# Manual secret creation (do not commit credentials to Git):
# kubectl create secret generic grafana-admin -n monitoring \
#   --from-literal=admin-user=admin \
#   --from-literal=admin-password=<your-16-char-password>

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  namespace: argo-cd
  name: prometheus
spec:
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  sourceRepos:
    - '*'
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: kube-system

---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argo-cd
  name: prometheus
spec:
  project: prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  source:
    chart: kube-prometheus-stack
    repoURL: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    targetRevision: 87.19.1
    helm:
      values: |
        prometheus:
          # ingress:
          #   enabled: true
          #   ingressClassName: alb
          #   annotations:
          #     alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
          #     alb.ingress.kubernetes.io/backend-protocol: "HTTP"
          #     external-dns.alpha.kubernetes.io/hostname: "prometheus.eksauto.nemonobody.xyz"
          #   hosts:
          #     - prometheus.eksauto.nemonobody.xyz
          #   paths:
          #     - /*
          prometheusSpec:
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
        grafana:
          admin:
            existingSecret: grafana-admin
          service:
            type: "NodePort"
          ingress:
            enabled: true
            ingressClassName: alb
            annotations:
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
              alb.ingress.kubernetes.io/backend-protocol: "HTTP"
              external-dns.alpha.kubernetes.io/hostname: "grafana.eksauto.nemonobody.xyz"
              alb.ingress.kubernetes.io/healthcheck-path: "/api/health"
            hosts:
              - grafana.eksauto.nemonobody.xyz
            paths:
              - /*
          persistence:
            enabled: true
            type: sts
            storageClassName: gp3
            accessModes:
              - ReadWriteOnce
            size: 1Gi
            finalizers:
              - kubernetes.io/pvc-protection
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: default
                  orgId: 1
                  folder: ""
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/default
          dashboards:
            default:
              argo-cd:
                gnetId: 14584
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  